name: Attach latest APK to release / Adjuntar APK más reciente

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-apk:
    name: Attach the current ARM64 APK / Adjuntar el APK ARM64 actual
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the current source / Descargar el código actual
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Attach APK and source to the matching release / Adjuntar APK y código fuente
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' platform/mobile/AndroidManifest.xml)"
          test -n "$version" || { echo "Could not read Android versionName"; exit 1; }
          tag="$version"
          apk="downloads/GalaxyAndroid-v${version}-arm64.apk"
          test -s "$apk" || { echo "APK not found: $apk"; exit 1; }
          source_root="Galaxy-Android-Source-${version}"
          source_zip="$RUNNER_TEMP/${source_root}.zip"
          source_stage="$RUNNER_TEMP/source"
          git fetch --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          mkdir -p "$source_stage"
          git archive --format=tar --prefix="${source_root}/" "$tag" \
            | tar --exclude="${source_root}/downloads" -xf - -C "$source_stage"
          (cd "$source_stage" && zip -qr "$source_zip" "$source_root")
          test -s "$source_zip" || { echo "Source archive not created"; exit 1; }
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$tag" "$apk" "$source_zip" --clobber --repo "$GITHUB_REPOSITORY"
